---

ohmyzsh_user_name: '{{ ansible_user }}'
ohmyzsh_user_group: '{{ ansible_user_group }}'
ohmyzsh_user_home: '{{ ansible_user_dir }}'

ohmyzsh_theme: powerlevel10k/powerlevel10k

ohmyzsh_plugins:
  - colorize
  - git
  - pip
  - python
  - ssh-agent

ohmyzsh_venv_path: '{{ venv_path }}'
ohmyzsh_homebrew_bin_path: '{{ packages_homebrew_bin_path }}'
