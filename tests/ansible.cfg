[defaults]

inventory = inventory.yml
# ../roles holds this collection's roles, addressed by bare name from
# playbook.yml. ../.ansible/collections carries a symlink laying this
# repository out as ansible_collections/flyoverhead/macos, which is what makes
# the FQCN `flyoverhead.macos.vscode_extension` resolve without installing the
# collection first. `task install` creates it.
roles_path = ../roles
collections_path = ../.ansible/collections
forks = 10
callbacks_enabled = timer, profile_tasks
host_key_checking = false
display_skipped_hosts = false
interpreter_python = auto_silent
stdout_callback = yaml

[connection]

pipelining = true
