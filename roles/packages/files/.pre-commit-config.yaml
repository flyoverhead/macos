---

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # put latest release tag from: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:

      - id: check-added-large-files
        name: Check for large files added
        description: Prevents giant files from being committed
        args:
          - --maxkb=1000

      - id: check-json
        name: Check json files syntax
        description: Verifies json files syntax

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Checks for files that contain merge conflict strings

      - id: check-symlinks
        name: Check for broken symlinks
        description: Checks for symlinks which do not point to anything

      - id: check-toml
        name: Check toml files syntax
        description: Verifies TOML files syntax

      - id: check-xml
        name: Check xml files syntax
        description: Verifies xml files syntax

      - id: check-yaml
        name: Check yaml files syntax
        description: Verifies yaml files syntax
        exclude: component.yml|.gitlab-ci.yml|^\.gitlab-ci/|^pipelines/
        args:
          - --allow-multiple-documents

      - id: detect-private-key
        name: Detect for private keys added
        description: Checks for the existence of private keys

      - id: double-quote-string-fixer
        name: Fix double quote strings
        description: Replaces double quoted strings with single quoted strings
        exclude: .py

      - id: end-of-file-fixer
        name: Fix end-of-file
        description: Makes sure files end in a newline and only a newline

      - id: no-commit-to-branch
        name: Prevent commits to main/master branches
        description: Protects main and master branches from direct checkins

      - id: pretty-format-json
        name: Check for pretty json format
        description: Checks that all your JSON files are pretty
        args:
          - --autofix
          - --indent=2

      - id: requirements-txt-fixer
        name: Sort requirements.txt file
        description: Sorts entries in requirements.txt

      - id: sort-simple-yaml
        name: Sort simple yaml files
        description: Sorts simple YAML files which consist only of top-level keys, preserving comments and blocks

      - id: trailing-whitespace
        name: Trim trailing whitespaces
        description: Trims trailing whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/tarioch/flux-check-hook
    rev: v0.8.0
    hooks:

      - id: check-flux-helm-values
        exclude: (clusters|enviroments)/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0 # put latest release tag from: https://github.com/antonbabenko/pre-commit-terraform/releases
    hooks:

      - id: terraform_fmt
        name: Run terraform fmt
        description: Format Terraform configuration files to a canonical style
        files: \.(tf|tfvars)$
        args:
          - --args=-no-color
          - --args=-diff

      - id: terraform_tflint
        name: Run tflint for internal and example
        description: Run TFLint for internal and example
        args:
          - --args=--disable-rule=terraform_required_version
          - --args=--disable-rule=terraform_required_providers
          - --args=--disable-rule=terraform_module_version
          - --args=--disable-rule=terraform_unused_declarations
        files: ^(internal|example)

      - id: terraform_tflint
        name: Run tflint for tf and tfvars
        description: Run tflint for tf and tfvars
        files: \.(tf|tfvars)$
        exclude: ^(internal|example)

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0 # put latest release tag from: https://github.com/ansible/ansible-lint/releases/
    hooks:

      - id: ansible-lint
        files: \.(yaml|yml)$
        name: Run ansible-lint
        language_version: python3.13
        additional_dependencies:
          - jmespath
        description: Run configuration from .ansible-lint file

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0 # put latest release tag from: https://github.com/adrienverge/yamllint/tags
    hooks:

      - id: yamllint
        name: Run yamllint
        description: Run configuration from .yamllint
        files: \.(yaml|yml)$
        types:
          - file
          - yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # put latest release tag from: https://github.com/gitleaks/gitleaks/releases
    hooks:

      - id: gitleaks-system
        name: Run gitleaks
        description: Detect hardcoded secrets in staged changes
        pass_filenames: false

  - repo: local
    hooks:

      - id: show-json-diff
        name: Show pretty-format-json changes
        entry: git --no-pager diff --color -- '*.json'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

exclude: ^data
