---

- name: claude | create config directory
  become: true
  ansible.builtin.file:
    path: '{{ packages_claude_config_path }}'
    state: directory
    owner: '{{ packages_user_name }}'
    group: '{{ packages_user_group }}'
    mode: '0755'

- name: claude | settings
  when:
    - packages_claude_settings | length > 0
  block:

    - name: claude | check settings
      ansible.builtin.stat:
        path: '{{ packages_claude_config_path }}/settings.json'
      register: packages_claude_settings_file

    - name: claude | read settings
      ansible.builtin.slurp:
        src: '{{ packages_claude_config_path }}/settings.json'
      register: packages_claude_settings_current
      when:
        - packages_claude_settings_file.stat.exists

    # Claude Code rewrites this file at runtime, so the managed keys are merged
    # over it rather than replacing it.
    - name: claude | create settings
      become: true
      ansible.builtin.copy:
        content: "{{
          (packages_claude_settings_current.content | b64decode | from_json
          if packages_claude_settings_file.stat.exists else {})
          | combine(packages_claude_settings, recursive=True)
          | to_nice_json(indent=2, sort_keys=False) }}\n"
        dest: '{{ packages_claude_config_path }}/settings.json'
        owner: '{{ packages_user_name }}'
        group: '{{ packages_user_group }}'
        mode: '0644'

- name: claude | create CLAUDE.md
  become: true
  ansible.builtin.copy:
    content: '{{ packages_claude_md }}'
    dest: '{{ packages_claude_config_path }}/CLAUDE.md'
    owner: '{{ packages_user_name }}'
    group: '{{ packages_user_group }}'
    mode: '0644'
  when:
    - packages_claude_md | length > 0

- name: claude | create statusline script
  become: true
  ansible.builtin.template:
    src: claude_statusline.j2
    dest: '{{ packages_claude_config_path }}/statusline.sh'
    owner: '{{ packages_user_name }}'
    group: '{{ packages_user_group }}'
    mode: '0755'
  when:
    - packages_claude_statusline_install

- name: claude | mcp servers
  when:
    - packages_claude_mcp_servers | length > 0
  block:

    - name: claude | check state file
      ansible.builtin.stat:
        path: '{{ packages_claude_json_path }}'
      register: packages_claude_json_file

    - name: claude | read state file
      ansible.builtin.slurp:
        src: '{{ packages_claude_json_path }}'
      register: packages_claude_json_current
      when:
        - packages_claude_json_file.stat.exists
      no_log: true

    - name: claude | parse state file
      ansible.builtin.set_fact:
        packages_claude_json: >-
          {{ packages_claude_json_current.content | b64decode | from_json
          if packages_claude_json_file.stat.exists else {} }}
      no_log: true

    # `no_log` because the file holds the OAuth account and the MCP tokens.
    - name: claude | create mcp servers
      become: true
      ansible.builtin.copy:
        content: "{{
          packages_claude_json
          | combine({'mcpServers': packages_claude_json.mcpServers | default({})
          | combine(packages_claude_mcp_servers)})
          | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) }}"
        dest: '{{ packages_claude_json_path }}'
        owner: '{{ packages_user_name }}'
        group: '{{ packages_user_group }}'
        mode: '0600'
      no_log: true
