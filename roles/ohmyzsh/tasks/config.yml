---

- name: config | .zshrc
  become: true
  ansible.builtin.template:
    src: zshrc.j2
    dest: '{{ ohmyzsh_user_home }}/.zshrc'
    owner: '{{ ohmyzsh_user_name }}'
    group: '{{ ohmyzsh_user_group }}'
    mode: '0644'
    backup: true
    force: true

- name: config | .p10k.zsh
  become: true
  ansible.builtin.copy:
    src: p10k.zsh
    dest: '{{ ohmyzsh_user_home }}/.p10k.zsh'
    owner: '{{ ohmyzsh_user_name }}'
    group: '{{ ohmyzsh_user_group }}'
    mode: '0644'
