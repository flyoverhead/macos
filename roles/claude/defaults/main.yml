---

claude_user_name: '{{ ansible_user }}'
claude_user_group: '{{ ansible_facts.user_gid }}'
claude_user_home: '{{ ansible_facts.user_dir }}'

# Install Claude Code with Anthropic's native installer when it is missing.
claude_install: false

# `stable`, `latest` or an exact version such as `2.1.292`. A channel installs
# once and leaves updates to Claude Code's own updater; an exact version is
# reinstalled whenever the installed one differs, so also set
# `DISABLE_AUTOUPDATER` in `claude_settings.env` or the two fight.
claude_version: stable

claude_installer_url: https://claude.ai/install.sh
claude_bin_path: '{{ claude_user_home }}/.local/bin/claude'
claude_tmp_path: '{{ claude_user_home }}/tmp'

# Claude Code configuration directory, i.e. `CLAUDE_CONFIG_DIR`.
claude_config_path: '{{ claude_user_home }}/.claude'

# Deep-merged over the existing `settings.json`, so keys Claude Code writes at
# runtime survive and managed keys win; a managed list replaces the existing
# one. Empty means `settings.json` is left alone.
claude_settings: {}
  # model: opus
  # permissions:
  #   allow:
  #     - Bash(git:*)
  # statusLine:
  #   type: command
  #   command: bash "$HOME/.claude/statusline.sh"

# Written verbatim to `CLAUDE.md`. Empty means the file is left alone.
claude_md: ''

# Deploy `statusline.sh`; point `statusLine.command` at it to use it. It needs
# `jq` on `PATH`.
claude_statusline_install: false

# Claude Code's state file: `~/.claude.json`, or `.claude.json` inside
# `CLAUDE_CONFIG_DIR` when that is set.
claude_json_path: '{{ claude_user_home }}/.claude.json'

# User-scope MCP servers merged into `mcpServers` in the state file, each one
# replaced whole. Unlisted servers survive. Empty leaves the state file alone.
claude_mcp_servers: {}
  # gitlab:
  #   type: stdio
  #   command: glab
  #   args:
  #     - mcp
  #     - serve
