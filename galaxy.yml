---

namespace: flyoverhead
name: macos
version: 3.0.1
readme: README.md
authors:
  - flyoverhead
description: Ansible collection for macOS workstation configuration
license:
  - GPL-3.0-only
tags:
  - claude
  - dock
  - homebrew
  - macos
  - ohmyzsh
  - starship
  - shell
  - tools
  - workstation
  - zsh
dependencies:
  community.general: '>=8.0.0'

repository: https://github.com/flyoverhead/macos
issues: https://github.com/flyoverhead/macos/issues

# fnmatch patterns against the path relative to the collection root, so nested
# matches need a leading `*` -- a bare `.DS_Store` only ever matches the one at
# the top level
build_ignore:
  - '*.DS_Store'
  - .ansible
  - .ansible-lint
  - .claude
  - .pre-commit-config.yaml
  - .superpowers
  - .tflint.hcl
  - .vagrant
  - .venv
  - .vscode
  - .yamllint
  - Taskfile.yml
  - tests
